[package]
name = "ikigai-meeting"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "Video-conference scheduling as ikigai ROC resources: urn:meeting:schedule (a facade) dispatches to pluggable provider backends. Slice 0 ships a Zoom backend (Server-to-Server OAuth); the join URL is emitted as ical:conference so one value flows into the .ics, the calendar event, and an org entry."
repository = "https://github.com/ikigai-rs/ikigai-meeting"
homepage = "https://github.com/ikigai-rs/ikigai-meeting"
keywords = ["ikigai", "roc", "meeting", "zoom", "calendar"]
categories = ["web-programming"]

[dependencies]
# Core 0.4.0 (scope opacity, structured denials; the cascade).
ikigai-core = "0.4.0"
# The host injects an HttpTransport through space(), so it shares this HTTP line
# with the module. HTTP 0.8.0 also uses core 0.4.0.
ikigai-http = "=0.8.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the target URLs' host for the per-host net capability check (ikigai_http::net_allows).
url = "2"
# Calendar validation and bundled IANA rules, including in browser hosts (no system clock).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`).
ikigai-conformance = "=0.15.0"
# Compare the Turtle and JSON faces using RDF terms and the shared vocabulary.
oxrdf = "0.3"
ikigai-vocab = "0.4.0"
