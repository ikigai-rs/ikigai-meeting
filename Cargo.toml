[package]
name = "ikigai-meeting"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "Video-conference scheduling as ikigai ROC resources: urn:meeting:schedule (a facade) dispatches to pluggable provider backends. Slice 0 ships a Zoom backend (Server-to-Server OAuth); the join URL is emitted as ical:conference so one value flows into the .ics, the calendar event, and an org entry."
repository = "https://github.com/ikigai-rs/ikigai-meeting"
homepage = "https://github.com/ikigai-rs/ikigai-meeting"
keywords = ["ikigai", "roc", "meeting", "zoom", "calendar"]
categories = ["web-programming"]

[dependencies]
# 0.1.108: the release with the failure classes (`FailureClass`, `Error::class()`, the `Refused`,
# `RetryAfter`, `OverBudget` and `Unsupported` variants, `Description::fails`; ledger #1546). This
# crate's own code reads them: the Zoom actions declare the classes they can fail with, and the
# errors the shared status table answers are those variants. It is also the floor
# `ikigai-http = "0.3.0"` sets, so no graph holding http 0.3 resolves lower anyway.
ikigai-core = "0.1.108"
# The HTTP I/O seam (HttpTransport) + wire types. The host injects one transport
# (ureq/reqwest natively, fetch in the browser); no HTTP client or executor is baked in.
# `HttpTransport` is in `space()`'s signature, so a host passes the SAME ikigai-http line it
# serves `urn:http:*` from: this pin moves in step with the host's, and moving it is a breaking
# (minor) release of this crate. 0.3.0 is the line with the ONE status table,
# `ikigai_http::status` (ledger #1546): an origin's answer becomes the same typed error here as
# in `urn:http:*` and ikigai-llm (401/403 `Refused`, 429 `RetryAfter`, 500 `Endpoint`, ...), and
# a transport failure a `Timeout` or an `Unavailable`. `ikigai_http::auth::basic` (ledger #1857)
# and `net_allows_port` (the port-aware ACL) are unchanged in it. A 0.x caret is a CEILING too:
# "0.3.0" admits 0.3.x only.
ikigai-http = "0.3.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the target URLs' host for the per-host net capability check (ikigai_http::net_allows).
url = "2"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). 0.10.0 carries the FAILURES check
# (opt-in there through `Suite::check_failures`, the default from 0.11) and the `fails_under`
# probes, which hold the Zoom action to the failure classes it declares (ledger #1546). A 0.x
# caret is a CEILING too: "0.10.0" admits 0.10.x only, so the next minor is a deliberate pin
# change.
ikigai-conformance = "0.10.0"
# The cross-face term-equality test (`tests/conformance.rs`): compares the Turtle face as
# parsed RDF terms, and reads `ik:passcode`'s declared range from the shared vocabulary.
# oxrdf 0.3 is the term model `ikigai_conformance::rdf::parse` returns; ikigai-vocab moves in
# step with ikigai-core (0.1.108 is what conformance 0.10.0 pins); `ik:passcode` has been in it
# since 0.1.69.
oxrdf = "0.3"
ikigai-vocab = "0.1.108"
